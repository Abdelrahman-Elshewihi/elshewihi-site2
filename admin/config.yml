backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: https://YOUR-SITE.netlify.app
display_url: https://YOUR-SITE.netlify.app
logo_url: /images/avatar.jpg

locale: "ar"

collections:
  - name: "projects"
    label: "المشاريع (Projects)"
    label_singular: "مشروع"
    file: "data/projects.json"
    format: "json"
    extension: "json"
    fields:
      - label: "قائمة المشاريع"
        name: "items"
        widget: "list"
        summary: "{{fields.title.ar}}"
        fields:
          - { label: "المعرّف (id — إنجليزي، بدون مسافات)", name: "id", widget: "string" }
          - { label: "مشروع مميز (كارت كبير)؟", name: "featured", widget: "boolean", default: false }
          - { label: "صورة المشروع", name: "image", widget: "image" }
          - label: "التصنيف"
            name: "category"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "العنوان"
            name: "title"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "وصف قصير"
            name: "desc"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "text" }
              - { label: "English", name: "en", widget: "text" }
          - label: "المشكلة اللي بيحلها"
            name: "problem"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "text" }
              - { label: "English", name: "en", widget: "text" }
          - label: "اللي عملته"
            name: "did"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "text" }
              - { label: "English", name: "en", widget: "text" }
          - label: "التقنيات المستخدمة"
            name: "tech"
            widget: "list"
            field: { label: "تقنية", name: "tech_item", widget: "string" }
          - label: "السعر التقريبي"
            name: "price"
            widget: "object"
            fields:
              - { label: "النطاق السعري (مثال: 2,500 — 4,000)", name: "value", widget: "string" }
              - { label: "العملة", name: "currency", widget: "string", default: "EGP" }
