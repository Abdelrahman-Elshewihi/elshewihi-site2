backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

site_url: https://el-shewihi-eng.vercel.app
display_url: https://el-shewihi-eng.vercel.app
logo_url: /images/avatar.jpg

locale: "ar"

collections:
  - name: "projects"
    label: "المشاريع (Projects)"
    label_singular: "مشروع"
    file: "data/projects.json"
    format: "json"
    extension: "json"
    fields:
      - label: "قائمة المشاريع"
        name: "items"
        widget: "list"
        summary: "{{fields.title.ar}}"
        fields:
          - { label: "المعرّف (id — إنجليزي، بدون مسافات)", name: "id", widget: "string" }
          - { label: "مشروع مميز (كارت كبير)؟", name: "featured", widget: "boolean", default: false }
          - label: "التصنيفات (لظهور المشروع تحت فلتر معين)"
            name: "tags"
            widget: "select"
            multiple: true
            options: ["logo", "card", "website", "video", "app", "voice"]
          - { label: "صورة المشروع (اختياري لو فيه فيديو — هتتاخد صورة يوتيوب تلقائي)", name: "image", widget: "image", required: false }
          - { label: "كود فيديو يوتيوب (بس الكود، مش اللينك كامل)", name: "video", widget: "string", required: false }
          - { label: "الفيديو عمودي (Shorts)؟", name: "videoVertical", widget: "boolean", default: false, required: false }
          - label: "التصنيف"
            name: "category"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "العنوان"
            name: "title"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "وصف قصير"
            name: "desc"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "text" }
              - { label: "English", name: "en", widget: "text" }
          - label: "المشكلة اللي بيحلها"
            name: "problem"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "text" }
              - { label: "English", name: "en", widget: "text" }
          - label: "اللي عملته"
            name: "did"
            widget: "object"
            fields:
              - { label: "عربي", name: "ar", widget: "text" }
              - { label: "English", name: "en", widget: "text" }
          - label: "التقنيات المستخدمة"
            name: "tech"
            widget: "list"
            field: { label: "تقنية", name: "tech_item", widget: "string" }
          - label: "السعر التقريبي (اتركه فاضي لو هتستخدم priceText بدله)"
            name: "price"
            widget: "object"
            required: false
            fields:
              - { label: "النطاق السعري (مثال: 2,500 — 4,000)", name: "value", widget: "string", required: false }
              - { label: "العملة", name: "currency", widget: "string", default: "USD", required: false }
          - label: "نص سعر بديل (مثلاً: تواصل معنا) — بيتقدم على السعر الرقمي لو موجود"
            name: "priceText"
            widget: "object"
            required: false
            fields:
              - { label: "عربي", name: "ar", widget: "string", required: false }
              - { label: "English", name: "en", widget: "string", required: false }
