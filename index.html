<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdelrahman Elshewihi — Computer Engineer &amp; Creative Developer</title>
<meta name="description" content="عبدالرحمن الشويحي — مهندس حاسبات ومطوّر إبداعي. أصمم وأبني تجارب رقمية هندسية بلمسة إبداعية: مواقع، تصميم هوية بصرية، وأعمال رقمية مخصصة.">
<meta name="theme-color" content="#05070c">
<meta property="og:title" content="Abdelrahman Elshewihi — Computer Engineer & Creative Developer">
<meta property="og:description" content="Portfolio هندسي إبداعي — مشاريع، هوية بصرية، وتواصل مباشر عبر واتساب.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%2322e0e0%22>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070c; --bg-2:#0a0f1a; --bg-3:#0d1420;
  --accent:#3fa9ff; --accent-2:#22e0e0; --accent-3:#7c9cff;
  --text:#eef2f8; --text-dim:#93a1b8; --text-faint:#5b6780;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --glass:rgba(14,20,32,.55); --glass-strong:rgba(14,20,32,.78);
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  --glow:0 0 40px rgba(63,169,255,.25);
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --font-ar:'Cairo',sans-serif;
  --nav-h:76px;
}
html[data-theme="light"]{
  --bg:#f2f5fa; --bg-2:#ffffff; --bg-3:#eaeff7;
  --accent:#0a66ff; --accent-2:#008f8f; --accent-3:#4f5fd8;
  --text:#0b1220; --text-dim:#4c5772; --text-faint:#8892a8;
  --border:rgba(10,20,45,.09); --border-strong:rgba(10,20,45,.16);
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.82);
  --shadow:0 20px 50px -25px rgba(20,30,60,.25);
  --glow:0 0 40px rgba(10,102,255,.15);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:auto;}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-ar);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .5s var(--ease), color .5s var(--ease);
  cursor:auto;
}
html[lang="en"] body{font-family:var(--font-body);}
::selection{background:var(--accent); color:#04070c;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; background:none; border:none; color:inherit; cursor:pointer;}
.mono{font-family:var(--font-mono); letter-spacing:.04em;}
.eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent-2); display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.eyebrow::before{content:''; width:22px; height:1px; background:var(--accent-2); opacity:.6;}
html[dir="rtl"] .eyebrow::before{order:2;}
section{position:relative; padding:120px 6vw;}
@media(max-width:768px){ section{padding:80px 6vw;} }
.container{max-width:1240px; margin:0 auto;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:-.02em; line-height:1.05;}
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3{font-family:var(--font-ar); font-weight:700; letter-spacing:0;}
h2{font-size:clamp(30px,4vw,48px); margin-bottom:16px;}
p{color:var(--text-dim); line-height:1.75; font-size:16px;}
.section-head{max-width:640px; margin-bottom:56px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
}

.cursor{
  position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%;
  background:var(--accent-2); pointer-events:none; z-index:9999;
  transform:translate(-50%,-50%); mix-blend-mode:difference;
  transition:width .25s var(--ease), height .25s var(--ease), background .25s var(--ease);
  will-change:transform;
}
.cursor-ring{
  position:fixed; top:0; left:0; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border-strong); pointer-events:none; z-index:9998;
  transform:translate(-50%,-50%); will-change:transform;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; color:var(--text);
  background:transparent;
}
.cursor-ring span{opacity:0; transition:opacity .2s;}
.cursor-ring.label span{opacity:1;}
.cursor-ring.grow{width:64px; height:64px; background:var(--glass-strong); border-color:var(--accent-2); backdrop-filter:blur(6px);}
body.no-cursor .cursor, body.no-cursor .cursor-ring{display:none;}
@media(hover:none), (pointer:coarse){ .cursor, .cursor-ring{display:none !important;} }

#intro{
  position:fixed; inset:0; z-index:10000; background:#04060a;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .7s var(--ease), visibility .7s;
}
#intro.done{opacity:0; visibility:hidden; pointer-events:none;}
.intro-mark{
  font-family:var(--font-display); font-size:clamp(48px,10vw,96px); font-weight:600; color:var(--text);
  position:relative; letter-spacing:-.03em;
}
.intro-mark::after{
  content:''; position:absolute; inset:-18px; border:1px solid var(--border-strong); border-radius:50%;
  opacity:0;
}
.intro-bar{width:180px; height:1px; background:var(--border-strong); margin-top:28px; overflow:hidden; position:relative;}
.intro-bar i{position:absolute; inset:0; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); display:block;}
.intro-skip{position:absolute; bottom:32px; font-family:var(--font-mono); font-size:11px; letter-spacing:.15em; color:var(--text-faint); text-transform:uppercase; opacity:0;}

.navbar{
  position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:900;
  display:flex; align-items:center; gap:6px; padding:8px 8px 8px 18px;
  background:var(--glass); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--border); border-radius:100px; box-shadow:var(--shadow);
  transition:transform .5s var(--ease), top .4s var(--ease), background .4s;
  max-width:94vw;
}
html[dir="rtl"] .navbar{padding:8px 18px 8px 8px;}
.navbar.hide{transform:translateX(-50%) translateY(-140%);}
.nav-logo{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:-.02em; white-space:nowrap; display:flex; align-items:center; gap:8px;}
.nav-logo .dot{width:7px; height:7px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 10px var(--accent-2);}
.nav-links{display:flex; align-items:center; gap:4px; margin:0 18px; font-family:var(--font-mono); font-size:12px; letter-spacing:.04em;}
.nav-links a{padding:8px 12px; border-radius:100px; color:var(--text-dim); transition:.3s;}
.nav-links a:hover, .nav-links a.active{color:var(--text); background:rgba(255,255,255,.06);}
html[data-theme="light"] .nav-links a:hover, html[data-theme="light"] .nav-links a.active{background:rgba(10,20,45,.06);}
.nav-tools{display:flex; align-items:center; gap:6px;}
.nav-btn{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border); color:var(--text-dim); transition:.3s; font-size:14px;
}
.nav-btn:hover{color:var(--text); border-color:var(--border-strong);}
.nav-cta{
  font-family:var(--font-mono); font-size:12px; padding:9px 18px; border-radius:100px;
  background:var(--text); color:var(--bg); font-weight:500; white-space:nowrap; transition:.3s;
}
.nav-cta:hover{background:var(--accent-2);}
@media(max-width:860px){ .nav-links{display:none;} }

.hero{
  min-height:100svh; display:flex; align-items:center; padding-top:calc(var(--nav-h) + 40px);
  position:relative; overflow:hidden;
}
.hero-glow{
  position:absolute; width:900px; height:900px; border-radius:50%; top:-380px; inset-inline-end:-380px;
  background:radial-gradient(circle, rgba(63,169,255,.16), transparent 65%); pointer-events:none; filter:blur(10px);
}
.hero-grid{
  position:absolute; inset:0; opacity:.35; pointer-events:none;
  background-image:linear-gradient(var(--border) 1px,transparent 1px), linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:64px 64px; mask-image:radial-gradient(ellipse 70% 55% at 50% 30%, black, transparent);
}
.hero-inner{display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; width:100%;}
@media(max-width:900px){ .hero-inner{grid-template-columns:1fr; text-align:center;} .hero-glow{inset-inline-end:-200px; width:600px; height:600px;} }
.hero-title{font-size:clamp(38px,5.6vw,74px); overflow:hidden;}
.hero-title .line{display:block; overflow:hidden;}
.hero-title .line span{display:block; transform:translateY(110%);}
.hero-title .grad{
  background:linear-gradient(100deg, var(--accent), var(--accent-2) 45%, var(--accent-3) 90%);
  background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:gradShift 7s ease-in-out infinite;
}
@keyframes gradShift{0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;}}
.hero-sub{max-width:520px; margin-top:22px; font-size:17px;}
@media(max-width:900px){ .hero-sub{margin-inline:auto;} }
.hero-cta-row{display:flex; gap:14px; margin-top:38px; flex-wrap:wrap;}
@media(max-width:900px){ .hero-cta-row{justify-content:center;} }
.btn-primary{
  font-family:var(--font-mono); font-size:13px; letter-spacing:.03em; padding:15px 26px; border-radius:100px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#04070c; font-weight:600;
  display:inline-flex; align-items:center; gap:10px; transition:transform .35s var(--ease), box-shadow .35s;
}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 30px -8px rgba(63,169,255,.5);}
.btn-ghost{
  font-family:var(--font-mono); font-size:13px; padding:15px 24px; border-radius:100px; border:1px solid var(--border-strong);
  display:inline-flex; align-items:center; gap:8px; transition:.35s var(--ease);
}
.btn-ghost:hover{background:rgba(255,255,255,.05); border-color:var(--text-faint);}
.hero-stats{display:flex; gap:34px; margin-top:56px; flex-wrap:wrap;}
@media(max-width:900px){ .hero-stats{justify-content:center;} }
.hero-stats div b{display:block; font-family:var(--font-display); font-size:26px;}
.hero-stats div span{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase;}

.hero-avatar-wrap{position:relative; display:flex; align-items:center; justify-content:center;}
.avatar-ring{
  position:relative; width:min(360px,80vw); aspect-ratio:1/1; border-radius:50%;
  border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center;
  transition:transform .3s var(--ease); transform-style:preserve-3d;
}
.avatar-ring::before{
  content:''; position:absolute; inset:-26px; border-radius:50%; border:1px dashed var(--border);
  animation:spin 40s linear infinite;
}
.avatar-ring::after{
  content:''; position:absolute; inset:14px; border-radius:50%;
  background:radial-gradient(circle at 30% 20%, rgba(63,169,255,.22), transparent 60%); pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.avatar-img{width:88%; aspect-ratio:1/1; border-radius:50%; object-fit:cover; box-shadow:0 20px 60px -20px rgba(0,0,0,.7);}
.avatar-orbit-dot{position:absolute; width:9px; height:9px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 14px var(--accent-2); top:6%; inset-inline-end:12%; animation:orbit 6s ease-in-out infinite;}
@keyframes orbit{0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);}}
.avatar-tag{
  position:absolute; bottom:0; inset-inline-start:0; background:var(--glass-strong); backdrop-filter:blur(10px);
  border:1px solid var(--border); border-radius:100px; padding:9px 16px; font-family:var(--font-mono); font-size:11px;
  display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);
}
.avatar-tag i{width:7px; height:7px; border-radius:50%; background:#2be07d; box-shadow:0 0 8px #2be07d;}

.scroll-cue{position:absolute; bottom:26px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; opacity:.6;}
.scroll-cue span{font-family:var(--font-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;}
.scroll-cue .line{width:1px; height:34px; background:linear-gradient(var(--text-faint),transparent); position:relative; overflow:hidden;}
.scroll-cue .line i{position:absolute; top:-100%; width:100%; height:100%; background:var(--accent-2); animation:cue 2s ease-in-out infinite;}
@keyframes cue{50%{top:100%;} 100%{top:100%;}}

.blueprint{height:90px; position:relative; margin:0 auto; max-width:1240px; padding:0 6vw;}
.blueprint svg{width:100%; height:100%; overflow:visible;}
.blueprint path{fill:none; stroke:var(--border-strong); stroke-width:1;}
.blueprint path.draw{stroke:var(--accent-2); stroke-dasharray:1400; stroke-dashoffset:1400;}

.bento{display:grid; grid-template-columns:repeat(6,1fr); gap:16px;}
@media(max-width:900px){ .bento{grid-template-columns:repeat(2,1fr);} }
.bento-card{
  grid-column:span 2; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:28px; position:relative; overflow:hidden; transition:border-color .4s, transform .4s var(--ease);
  --mx:50%; --my:50%;
}
.bento-card::before{
  content:''; position:absolute; inset:0; border-radius:inherit; opacity:0; transition:opacity .4s;
  background:radial-gradient(240px circle at var(--mx) var(--my), rgba(63,169,255,.14), transparent 70%);
  pointer-events:none;
}
.bento-card:hover::before{opacity:1;}
.bento-card:hover{border-color:var(--border-strong); transform:translateY(-4px);}
.bento-card.large{grid-column:span 4; grid-row:span 2;}
.bento-card.tall{grid-row:span 2;}
@media(max-width:900px){ .bento-card, .bento-card.large, .bento-card.tall{grid-column:span 2; grid-row:auto;} }
.bento-card h3{font-size:19px; margin-bottom:10px;}
.bento-card p{font-size:14.5px;}
.bento-icon{width:40px; height:40px; border-radius:12px; background:rgba(63,169,255,.1); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin-bottom:18px; font-size:18px; color:var(--accent-2);}
.bento-card.large .big-quote{font-family:var(--font-display); font-size:clamp(20px,2.4vw,28px); line-height:1.4; color:var(--text); margin-top:auto;}
.bento-card.large{display:flex; flex-direction:column; justify-content:space-between;}

.chip-cloud{display:flex; flex-wrap:wrap; gap:12px;}
.chip{
  font-family:var(--font-mono); font-size:13px; padding:10px 18px; border-radius:100px; border:1px solid var(--border);
  background:var(--bg-2); display:flex; align-items:center; gap:8px; transition:.3s var(--ease);
}
.chip:hover{border-color:var(--accent-2); color:var(--text); transform:translateY(-3px); box-shadow:0 10px 24px -12px rgba(34,224,224,.35);}
.chip .lvl{width:6px; height:6px; border-radius:50%; background:var(--text-faint);}
.chip:hover .lvl{background:var(--accent-2);}
.skill-groups{display:grid; gap:34px;}
.skill-group h4{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;}

.projects-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:20px;}
@media(max-width:900px){ .projects-grid{grid-template-columns:1fr;} }
.proj-card{
  grid-column:span 3; border-radius:var(--r-lg); overflow:hidden; position:relative; border:1px solid var(--border);
  background:var(--bg-2); cursor:pointer; transition:border-color .4s, transform .1s linear;
  transform-style:preserve-3d; perspective:1000px; will-change:transform;
}
.proj-card .glare{
  position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .4s;
  background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.14), transparent 55%);
  z-index:2;
}
.proj-card:hover .glare{opacity:1;}
.proj-card.featured{grid-column:span 6;}
.proj-media{aspect-ratio:16/10; overflow:hidden; position:relative;}
.proj-card.featured .proj-media{aspect-ratio:21/9;}
.proj-media img{width:100%; height:100%; object-fit:cover; transition:transform .7s var(--ease), filter .5s;}
.proj-card:hover .proj-media img{transform:scale(1.06);}
.proj-media::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 40%, rgba(4,6,10,.75)); opacity:.7; transition:.4s;}
.proj-body{padding:24px 26px; position:relative;}
.proj-cat{font-family:var(--font-mono); font-size:11px; color:var(--accent-2); letter-spacing:.1em; text-transform:uppercase;}
.proj-title{font-size:21px; margin:8px 0 8px;}
.proj-desc{font-size:14px;}
.proj-card:hover{border-color:var(--border-strong);}
.proj-value{
  position:absolute; top:18px; inset-inline-end:18px; background:var(--glass-strong); backdrop-filter:blur(10px);
  border:1px solid var(--border); border-radius:100px; padding:7px 14px; font-family:var(--font-mono); font-size:11px;
  opacity:0; transform:translateY(6px); transition:.4s var(--ease); display:flex; align-items:center; gap:6px;
}
.proj-card:hover .proj-value{opacity:1; transform:translateY(0);}
.proj-value .k{color:var(--text-faint);}
.proj-value .v{color:var(--accent-2); font-weight:600;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(3,5,10,.7); backdrop-filter:blur(6px); z-index:2000;
  display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .4s var(--ease);
}
.modal-overlay.open{opacity:1; pointer-events:auto;}
.modal{
  width:min(880px,100%); max-height:88vh; overflow-y:auto; background:var(--bg-2); border:1px solid var(--border-strong);
  border-radius:var(--r-xl); box-shadow:var(--shadow); transform:translateY(24px) scale(.98); transition:transform .45s var(--ease);
}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-media{aspect-ratio:16/8; overflow:hidden;}
.modal-media img{width:100%; height:100%; object-fit:cover;}
.modal-body{padding:36px;}
@media(max-width:640px){ .modal-body{padding:24px;} }
.modal-close{
  position:absolute; top:18px; inset-inline-end:18px; width:38px; height:38px; border-radius:50%; background:var(--glass-strong);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; z-index:5;
}
.modal-meta{display:flex; flex-wrap:wrap; gap:10px; margin:20px 0 24px;}
.modal-meta span{font-family:var(--font-mono); font-size:11.5px; padding:7px 12px; border-radius:100px; border:1px solid var(--border); color:var(--text-dim);}
.modal-block{margin-bottom:22px;}
.modal-block h4{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-2); margin-bottom:8px;}
.modal-price{
  display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-radius:var(--r-md);
  background:linear-gradient(135deg, rgba(63,169,255,.1), rgba(34,224,224,.06)); border:1px solid var(--border); margin-top:8px;
}
.modal-price b{font-family:var(--font-display); font-size:22px;}

.contact-panel{
  border-radius:var(--r-xl); background:var(--bg-2); border:1px solid var(--border); padding:70px 6vw; text-align:center;
  position:relative; overflow:hidden;
}
.contact-panel::before{
  content:''; position:absolute; width:600px; height:600px; background:radial-gradient(circle,rgba(63,169,255,.14),transparent 65%);
  top:-260px; left:50%; transform:translateX(-50%); pointer-events:none;
}
.contact-panel h2{
